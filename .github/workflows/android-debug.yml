name: Compilar APK Silêncius (teste da declaração)
on:
  push:
    branches:
      - main
      - fix/playstore-consent-20261113
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar JavaScript
        run: node --check www/app.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Silencius-2.8-consentimento-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
